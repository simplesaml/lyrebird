name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Verify tag matches version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(ruby -Ilib -rlyrebird/version -e 'print Lyrebird::VERSION')
          echo "tag=${TAG#v} version=$version"
          test "${TAG#v}" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Run tests
        run: bundle exec rake test
      - name: Build gem
        run: gem build lyrebird.gemspec
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish to RubyGems
        run: gem push "lyrebird-$VERSION.gem"
